name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run reference implementations
        run: |
          python src/l1_model.py
          python src/l2_capability.py
          python src/l3_collaboration.py
          python src/l4_governance.py

      - name: Validate schemas
        run: |
          python -c "import json, jsonschema; schema = json.load(open('schemas/audit_log.json')); print('audit_log.json: OK')"
          python -c "import yaml; yaml.safe_load(open('schemas/permission.yaml')); print('permission.yaml: OK')"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8
      - run: flake8 src/ --max-line-length=120 --ignore=E501,W503,E731
